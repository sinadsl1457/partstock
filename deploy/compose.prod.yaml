# 배포 서버(EC2)용. ~/partstock/ 에 이 파일, Caddyfile, .env를 두고 docker compose -f compose.prod.yaml up -d
# 밖으로 열리는 건 caddy(80·443)뿐. server·postgres는 이 안의 네트워크에서만 보인다.
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: partstock
      POSTGRES_USER: partstock
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # 메모리 1GB 서버라 버퍼를 작게
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partstock"]
      interval: 10s
      retries: 10

  server:
    # 자동 배포가 .env의 SERVER_IMAGE(ghcr.io/sinadsl1457/partstock-server:<커밋>)를 바꿔 끼운다
    image: ${SERVER_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET}
    volumes:
      # FCM 서비스 계정 키(커밋 안 함). EC2 ~/partstock/firebase.json, 본인만 읽기
      - ./firebase.json:/run/secrets/firebase.json:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  pgdata:
  caddy_data:
