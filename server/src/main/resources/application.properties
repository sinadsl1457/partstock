spring.application.name=partstock
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# 하루 시세를 내는 최소 판매 글 수(이상값을 뺀 뒤). 1단계 실측으로 다시 정한다.
partstock.collect.min-listings=5
# 매시간 정각(UTC). eBay 호출은 한 번에 약 60번 → 하루 약 1,400번(무료 한도 5,000). 테스트에서는 끈다.
partstock.collect.cron=0 0 * * * *

# eBay 키는 application-local.properties(커밋 안 함)에. 비어 있으면 수집할 때 에러.
ebay.client-id=
ebay.client-secret=
ebay.base-url=https://api.ebay.com
# 칩셋마다 최대 몇 쪽(쪽당 200개)까지 받을지. 램 32GB는 1천 개 가까이 나온다(11/21 실측)
# 한 번에 최대 5쪽(1,000글). 11/22 비교: 같은 판매자 글을 합친 뒤 5쪽과 10쪽 대표가가 대부분 1% 안 → 하루 호출 약 3,100 → 2,200
ebay.max-pages=5

# 원/달러 환율(키 없음)
fx.base-url=https://api.frankfurter.dev

# FCM 서비스 계정 키 파일. 없으면 알림을 보내지 않고 기록만 남긴다(로컬·테스트).
fcm.credentials-file=
# 기기 하나가 걸어 둘 수 있는 대기 중 알림 수
partstock.alert.max-per-device=20
