# 배포 서버. 값은 EC2의 ~/partstock/.env에서 환경 변수로 들어온다(커밋 안 함).
spring.datasource.url=jdbc:postgresql://postgres:5432/partstock
spring.datasource.username=partstock
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
ebay.client-id=${EBAY_CLIENT_ID}
ebay.client-secret=${EBAY_CLIENT_SECRET}
partstock.collect.on-start=true
# 밖에서는 Caddy를 거쳐 /api만 들어온다(서버 포트는 compose 안 네트워크에만 열림)
