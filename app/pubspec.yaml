name: partstock
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.1.4
  http: ^1.6.0
  injectable: ^3.0.0
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.1
  injectable_generator: ^3.1.3
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  # Space Grotesk(OFL, assets/fonts/OFL.txt). 한글은 폰 기본 글꼴로 이어진다
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
  uses-material-design: true

# 앱 아이콘: dart run flutter_launcher_icons (원본 assets/icon, 칩 로고를 브라우저로 그려 만든 것)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#0A0C0B"
  adaptive_icon_foreground: assets/icon/app_icon_fg.png
  remove_alpha_ios: true
