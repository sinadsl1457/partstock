# Android를 Play에 올린다(NowStation과 같은 방식). 앱 ID com.taektoy.partstock, 기업 개발자 계정.
#   태그 app-v* push → 비공개 테스트(alpha)에 바로 출시
#   Actions 화면에서 손으로 → 트랙·상태 고르기
# 앱의 첫 .aab는 Play Console에서 손으로 올려야 한다(Play API는 이미 있는 앱에만 올릴 수 있음) → 이 작업의 결과물(.aab)을 받아 쓴다.
name: 앱 Play 배포

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:
    inputs:
      track:
        description: "Play 트랙(alpha = 비공개 테스트, internal = 내부 테스트, production = 프로덕션)"
        default: internal
        required: true
      status:
        description: "completed = 바로 출시, draft = 초안(앱이 첫 심사를 통과하기 전에는 draft만 가능)"
        type: choice
        options: [completed, draft]
        default: draft
      upload:
        description: "Play에 올리기(끄면 .aab만 만든다: 첫 업로드는 손으로)"
        type: boolean
        default: true

concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode = 커밋 수라서 기록 전체가 필요
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

      - name: 업로드 키 꺼내기
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "RELEASE_KEYSTORE_BASE64 비밀값이 없다" >&2; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: 서명된 .aab(versionCode = 커밋 수)
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ runner.temp }}/upload.jks
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: flutter build appbundle --release --build-number="$(git rev-list --count HEAD)"

      - name: 버전·서명 확인
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" >/dev/null || { echo "서명되지 않은 .aab" >&2; exit 1; }
          jarsigner -verify -verbose -certs "$AAB" | grep -q "CN=partstock" || { echo "업로드 키가 아닌 키로 서명됨" >&2; exit 1; }
          echo "versionCode $(git rev-list --count HEAD), 커밋 ${GITHUB_SHA::7}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 출시 노트(마지막 커밋 제목)
        run: |
          mkdir -p whatsnew
          git log -1 --format=%s | cut -c1-480 > whatsnew/whatsnew-ko-KR

      - name: .aab 보관(첫 업로드·손으로 올릴 때)
        uses: actions/upload-artifact@v4
        with:
          name: partstock-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Google Play에 업로드
        if: github.event_name == 'push' || inputs.upload
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.taektoy.partstock
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ inputs.track || 'alpha' }}
          status: ${{ inputs.status || 'completed' }}
          whatsNewDirectory: app/whatsnew
